# Default configuration for AssoMemBench.
backend: mock              # mock | openai
chat_model: gpt-4o-mini
embed_model: text-embedding-3-small

agent:
  use_association: true     # HippoRAG personalized-PageRank spread (core associative ability)
  use_links: true          # A-MEM associative graph edges
  use_reflection: true     # Generative Agents insight generation
  use_forgetting: true     # MemoryBank Ebbinghaus consolidation
  top_k_retrieve: 8
  top_k_associate: 6
  ppr_damping: 0.5         # higher => association spreads further

reasoning_score:
  gamma: 0.8               # step discount (earlier constraints weighted higher)
  lambda: 0.4              # blend: partial-credit (0) <-> strict joint gate (1)
  beta: 0.5                # calibration penalty weight

judge:
  backend: openai          # use a DIFFERENT family than the agent (anti self-enhancement)
  models: [gpt-4o, claude-3-5-sonnet, gemini-1.5-pro]   # ensemble (majority/mean)
  samples: 1               # G-Eval n-sample-and-average (set >1 to smooth)
